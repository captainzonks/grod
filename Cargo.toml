[package]
name = "grod"
version = "0.2.0"
edition = "2021"
description = "grod (Google Fishing Rod) — cast YouTube/Piped videos to any Chromecast device with queue management and TUI"
license = "MIT"
repository = "https://github.com/captainzonks/grod"
homepage = "https://github.com/captainzonks/grod"
documentation = "https://docs.rs/grod"
readme = "README.md"
keywords = ["chromecast", "cast", "youtube", "piped", "cli"]
categories = ["command-line-utilities", "multimedia"]
exclude = [".github", "install.sh"]

[[bin]]
name = "grod"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# TUI
ratatui = "0.29"
crossterm = "0.28"

# IPC / state
dirs = "5"
libc = "0.2"

# Config file
toml = "0.8"

# Error handling
anyhow = "1"
thiserror = "2"
